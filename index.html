<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi, Eley 🌷</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Nunito',sans-serif; }

/* ── PAGE SYSTEM ── */
.page {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity 0.9s ease;
}
.page.out { opacity:0; pointer-events:none; }
.page.in  { opacity:1; pointer-events:all; }

/* ── WATERCOLOR BG ── */
.wc-bg { position:absolute; inset:0; background:#fdf8f4; overflow:hidden; z-index:0; }
.wc-bg::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(180,160,220,.20) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 20%,  rgba(150,210,240,.16) 0%, transparent 60%),
    radial-gradient(ellipse 70% 40% at 50% 85%,  rgba(220,180,200,.14) 0%, transparent 60%),
    radial-gradient(ellipse 90% 50% at 10% 70%,  rgba(160,200,230,.13) 0%, transparent 60%);
}
.wc-blob { position:absolute; border-radius:50%; filter:blur(70px); pointer-events:none; }

/* ══════════════════════════════════════════
   PAGE 1 — LOADING
══════════════════════════════════════════ */
#pg-load { background:#09071a; z-index:100; gap:1.4rem; }
.load-stars { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.lstar { position:absolute; background:white; border-radius:50%; animation:starTwinkle var(--d,3s) ease-in-out infinite; }
@keyframes starTwinkle { 0%,100%{opacity:.1;} 50%{opacity:.85;} }
#petal-canvas-load { position:absolute; inset:0; pointer-events:none; z-index:1; }
.load-title {
  font-family:'Playfair Display',serif;
  font-size:clamp(1.4rem,4vw,2.2rem); color:#ecddf8;
  text-align:center; letter-spacing:.08em; line-height:1.5; z-index:2;
  animation:softPulse 2.6s ease-in-out infinite;
}
.load-title em { color:#9dd8f8; font-style:italic; }
@keyframes softPulse { 0%,100%{opacity:.55;} 50%{opacity:1;} }
.load-bar-wrap { width:200px; height:3px; background:rgba(255,255,255,.1); border-radius:4px; overflow:hidden; z-index:2; }
.load-bar { height:100%; width:0%; background:linear-gradient(90deg,#9b7fd4,#7ec8f0); border-radius:4px; transition:width .1s linear; }
.load-sub { font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.28); z-index:2; }

/* ══════════════════════════════════════════
   PAGE 2 — STITCH + YES/NO
══════════════════════════════════════════ */
#pg-stitch { gap:0; }
.stitch-poem {
  font-family:'Playfair Display',serif;
  font-size:clamp(.95rem,2.6vw,1.35rem); color:#6a4a7a;
  text-align:center; letter-spacing:.04em; line-height:1.7; z-index:2;
  margin-bottom:1.1rem; animation:poemFloat 4s ease-in-out infinite;
}
.stitch-poem em { color:#5a90c0; font-style:italic; }
@keyframes poemFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
.window-frame {
  position:relative; z-index:2;
  background:rgba(255,252,250,.82);
  border:2.5px solid #c8b0d8; border-radius:18px;
  padding:1.2rem 1.4rem 1rem;
  box-shadow:0 0 0 6px rgba(200,176,216,.13),0 10px 40px rgba(120,80,160,.13),inset 0 1px 0 rgba(255,255,255,.8);
  display:flex; flex-direction:column; align-items:center; gap:.6rem;
  width:min(300px,88vw);
}
.window-frame::before {
  content:''; position:absolute; top:14px; bottom:14px; left:50%;
  width:2px; background:rgba(200,176,216,.4); transform:translateX(-50%);
  pointer-events:none; border-radius:2px;
}
.window-frame::after {
  content:''; position:absolute; left:14px; right:14px; top:50%;
  height:2px; background:rgba(200,176,216,.4); transform:translateY(-50%);
  pointer-events:none; border-radius:2px;
}
.stitch-gif { width:180px; height:180px; object-fit:cover; border-radius:12px; display:block; position:relative; z-index:3; }
.btn-row {
  display:flex; align-items:center; justify-content:center; gap:1rem;
  z-index:2; margin-top:.7rem; width:min(300px,88vw);
  position:relative; height:52px;
}
#btn-yes {
  background:linear-gradient(135deg,#a87fc8,#7ec4e8); color:white; border:none;
  border-radius:40px; padding:.6rem 1.8rem;
  font-family:'Playfair Display',serif; font-size:1rem; cursor:pointer;
  letter-spacing:.06em; box-shadow:0 4px 18px rgba(150,100,200,.3);
  transition:transform .2s,box-shadow .2s; flex-shrink:0; white-space:nowrap;
}
#btn-yes:hover  { transform:scale(1.06); box-shadow:0 6px 24px rgba(150,100,200,.45); }
#btn-yes:active { transform:scale(0.97); }
#btn-no {
  background:rgba(255,255,255,.7); color:#9a7aaa;
  border:1.5px solid #c8a8e0; border-radius:40px; padding:.6rem 1.4rem;
  font-family:'Playfair Display',serif; font-size:1rem; cursor:pointer;
  letter-spacing:.06em; flex-shrink:0; white-space:nowrap;
  transition:font-size .3s,padding .3s,opacity .3s,
             left .3s cubic-bezier(.34,1.5,.64,1),top .3s cubic-bezier(.34,1.5,.64,1);
}

/* ══════════════════════════════════════════
   PAGE 3 — TULIP IN VASE  (themed)
══════════════════════════════════════════ */
#pg-bouquet { gap:1rem; }

/* ── THEMED BACKGROUND LAYER ── */
/* sits behind everything in the bouquet page */
#theme-bg {
  position:absolute; inset:0; z-index:0;
  /* default = sky-blue light */
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%, rgba(150,210,245,.40) 0%, transparent 65%),
    radial-gradient(ellipse 65% 55% at 85% 18%, rgba(120,190,245,.28) 0%, transparent 60%),
    radial-gradient(ellipse 75% 45% at 50% 88%, rgba(155,215,248,.25) 0%, transparent 60%),
    linear-gradient(160deg,#e4f6ff 0%,#f0faff 40%,#d8eefb 70%,#c5e5f8 100%);
  transition: background 1.2s ease;
}
#theme-bg.purple {
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%, rgba(150,60,230,.42) 0%, transparent 65%),
    radial-gradient(ellipse 65% 55% at 85% 18%, rgba(110,40,210,.30) 0%, transparent 60%),
    radial-gradient(ellipse 75% 45% at 50% 88%, rgba(90,30,180,.38) 0%, transparent 60%),
    linear-gradient(160deg,#18062c 0%,#270d44 38%,#1c0836 65%,#100524 100%);
}

/* blossom canvas sits above theme-bg */
#blossom-canvas { position:absolute; inset:0; pointer-events:none; z-index:1; }

/* tulip scene sits above canvas */
#tulip-scene {
  position:relative; z-index:2;
  opacity:0; transform:translateY(30px);
  transition:opacity 1s ease, transform 1.1s cubic-bezier(.22,1,.36,1);
}
#tulip-scene.show { opacity:1; transform:translateY(0); }

#tulip-float { animation:none; transform-origin:center bottom; }
#tulip-float.floating { animation:tulipFloat 3.6s ease-in-out infinite; }
@keyframes tulipFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }

/* ── PETAL GLOW ANIMATIONS ── */
/* sky-blue mode (default) */
@keyframes petalGlowBlue {
  0%,100% { opacity:.75; filter:drop-shadow(0 0 5px rgba(100,200,255,.5)); }
  50%      { opacity:1;   filter:drop-shadow(0 0 16px rgba(100,200,255,.95)); }
}
@keyframes petalGlowBlueSlow {
  0%,100% { opacity:.70; filter:drop-shadow(0 0 4px rgba(100,200,255,.4)); }
  50%      { opacity:.95; filter:drop-shadow(0 0 14px rgba(100,200,255,.85)); }
}
/* purple mode */
@keyframes petalGlowPurple {
  0%,100% { opacity:.75; filter:drop-shadow(0 0 6px rgba(180,80,255,.55)); }
  50%      { opacity:1;   filter:drop-shadow(0 0 20px rgba(180,80,255,1.0)); }
}
@keyframes petalGlowPurpleSlow {
  0%,100% { opacity:.70; filter:drop-shadow(0 0 5px rgba(180,80,255,.45)); }
  50%      { opacity:.95; filter:drop-shadow(0 0 18px rgba(180,80,255,.90)); }
}

/* Applied via class on the tulip-float group */
.petal-anim-blue      .glow-petal      { animation:petalGlowBlue     2.4s ease-in-out infinite; }
.petal-anim-blue      .glow-petal-slow { animation:petalGlowBlueSlow  3.4s ease-in-out infinite; }
.petal-anim-purple    .glow-petal      { animation:petalGlowPurple    2.4s ease-in-out infinite; }
.petal-anim-purple    .glow-petal-slow { animation:petalGlowPurpleSlow 3.4s ease-in-out infinite; }

/* Tulip petal fills — swapped via JS on the SVG gradient stops */

/* bq-text */
.bq-text {
  font-family:'Playfair Display',serif;
  font-size:clamp(1.05rem,3.2vw,1.65rem); color:#5a7a90;
  text-align:center; letter-spacing:.06em; z-index:2;
  opacity:0; transform:translateY(14px);
  transition:opacity 1.1s ease,transform 1.1s ease,color .9s ease;
}
.bq-text.show   { opacity:1; transform:translateY(0); }
.bq-text.purple { color:#c8a0f0; }

/* next button */
#btn-next {
  position:fixed; bottom:1.8rem; right:1.8rem;
  background:linear-gradient(135deg,#a87fc8,#7ec4e8); color:white; border:none;
  border-radius:40px; padding:.6rem 1.7rem;
  font-family:'Playfair Display',serif; font-size:.95rem; cursor:pointer;
  letter-spacing:.06em; box-shadow:0 4px 18px rgba(150,100,200,.3);
  opacity:0; transform:translateY(10px);
  transition:opacity .9s ease,transform .9s ease,box-shadow .2s;
  z-index:10; pointer-events:none;
}
#btn-next.show { opacity:1; transform:translateY(0); pointer-events:all; }
#btn-next:hover { box-shadow:0 6px 24px rgba(150,100,200,.45); }

/* ══════════════════════════════════════════
   SWITCH BUTTON
══════════════════════════════════════════ */
#switch-btn {
  position:fixed; top:18px; right:18px; z-index:50;
  display:none; align-items:center; gap:7px;
  padding:8px 18px; border-radius:40px;
  border:1.5px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(12px);
  color:#2a4a70;
  font-family:'Nunito',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(80,160,255,.22);
  transition:background .8s ease, color .8s ease, border-color .8s ease,
             box-shadow .4s ease, transform .2s ease;
}
#switch-btn:hover  { transform:scale(1.06); }
#switch-btn:active { transform:scale(0.96); }
#switch-btn.purple-mode {
  color:#e0c0ff;
  border-color:rgba(200,130,255,.65);
  background:rgba(70,15,110,.50);
  box-shadow:0 4px 18px rgba(160,50,255,.38);
}
#switch-dot {
  width:9px; height:9px; border-radius:50%;
  background:linear-gradient(135deg,#6ab8e8,#90d0ff);
  flex-shrink:0;
  transition:background .8s ease, box-shadow .8s ease;
}
#switch-dot.purple {
  background:linear-gradient(135deg,#9040e0,#c060ff);
  box-shadow:0 0 8px rgba(180,70,255,.85);
}

</style>
</head>
<body>

<!-- ══ PAGE 1: LOADING ══ -->
<div class="page in" id="pg-load">
  <div class="load-stars" id="load-stars"></div>
  <canvas id="petal-canvas-load"></canvas>
  <div class="load-title">for you,<br><em>always.</em></div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-sub">preparing something special…</div>
</div>

<!-- ══ PAGE 2: STITCH + YES/NO ══ -->
<div class="page out" id="pg-stitch">
  <div class="wc-bg">
    <div class="wc-blob" style="width:500px;height:400px;background:#c8a8e8;top:-120px;left:-120px;opacity:.18;"></div>
    <div class="wc-blob" style="width:380px;height:300px;background:#90c8e8;top:40px;right:-80px;opacity:.14;"></div>
    <div class="wc-blob" style="width:560px;height:280px;background:#e8c0d8;bottom:-90px;left:50%;transform:translateX(-50%);opacity:.13;"></div>
  </div>
  <p class="stitch-poem">A little something,<br>picked just for <em>you.</em></p>
  <div class="window-frame">
    <img class="stitch-gif" src="stitch.gif" alt="Stitch offering flowers">
  </div>
  <div class="btn-row">
    <button id="btn-yes" onclick="clickYes()">Yes ✦</button>
    <button id="btn-no"  onclick="clickNo()">No</button>
  </div>
</div>

<!-- ══ PAGE 3: TULIP IN VASE (themed) ══ -->
<div class="page out" id="pg-bouquet">
  <!-- Themed background — behind everything -->
  <div id="theme-bg"></div>
  <!-- Falling blossoms canvas -->
  <canvas id="blossom-canvas"></canvas>

  <div id="tulip-scene">
    <svg id="tulip-svg" viewBox="0 0 260 420" width="260" height="420"
         xmlns="http://www.w3.org/2000/svg" overflow="visible">
      <defs>
        <linearGradient id="vaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="rgba(160,210,240,0.18)"/>
          <stop offset="25%"  stop-color="rgba(200,235,255,0.55)"/>
          <stop offset="50%"  stop-color="rgba(230,248,255,0.75)"/>
          <stop offset="75%"  stop-color="rgba(200,235,255,0.50)"/>
          <stop offset="100%" stop-color="rgba(140,200,235,0.15)"/>
        </linearGradient>
        <linearGradient id="vaseShine" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"  stop-color="rgba(255,255,255,0)"/>
          <stop offset="30%" stop-color="rgba(255,255,255,0.55)"/>
          <stop offset="50%" stop-color="rgba(255,255,255,0.0)"/>
        </linearGradient>
        <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="rgba(140,200,230,0.35)"/>
          <stop offset="100%" stop-color="rgba(100,170,210,0.55)"/>
        </linearGradient>
        <!-- Tulip petal gradients — stops updated by JS on theme switch -->
        <radialGradient id="petalCore" cx="50%" cy="60%" r="55%">
          <stop id="pCore0" offset="0%"   stop-color="#d0f0ff"/>
          <stop id="pCore1" offset="60%"  stop-color="#90ccf0"/>
          <stop id="pCore2" offset="100%" stop-color="#60a8d8"/>
        </radialGradient>
        <radialGradient id="petalOuter" cx="50%" cy="60%" r="55%">
          <stop id="pOut0" offset="0%"   stop-color="#b8e4f8"/>
          <stop id="pOut1" offset="70%"  stop-color="#78b8e0"/>
          <stop id="pOut2" offset="100%" stop-color="#5898c8"/>
        </radialGradient>
        <radialGradient id="petalSide" cx="50%" cy="60%" r="55%">
          <stop id="pSide0" offset="0%"   stop-color="#a8d8f0"/>
          <stop id="pSide1" offset="70%"  stop-color="#68a8d0"/>
          <stop id="pSide2" offset="100%" stop-color="#4888b8"/>
        </radialGradient>
        <!-- Glow halo — color updated by JS -->
        <filter id="glowFilter" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- VASE (static) -->
      <g id="vase-group">
        <path d="M88 318 Q88 355 90 368 Q130 375 170 368 Q172 355 172 318 Z" fill="url(#waterGrad)"/>
        <path d="M88 290 L88 370 Q130 382 172 370 L172 290 Q130 278 88 290Z"
              fill="url(#vaseGrad)" stroke="rgba(140,200,235,0.6)" stroke-width="1.5"/>
        <ellipse cx="130" cy="290" rx="42" ry="14"
                 fill="rgba(200,240,255,0.4)" stroke="rgba(160,220,245,0.7)" stroke-width="1.5"/>
        <ellipse cx="130" cy="370" rx="42" ry="12"
                 fill="rgba(150,210,240,0.3)" stroke="rgba(130,195,230,0.5)" stroke-width="1"/>
        <path d="M95 300 Q92 335 93 365"
              stroke="rgba(255,255,255,0.6)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M112 282 Q110 310 111 340"
              stroke="rgba(255,255,255,0.35)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M88 290 L88 370 Q105 378 122 374 L122 284 Q105 282 88 290Z"
              fill="url(#vaseShine)" opacity="0.5"/>
        <ellipse cx="130" cy="318" rx="38" ry="7"
                 fill="rgba(180,230,250,0.3)" stroke="rgba(160,215,240,0.4)" stroke-width="1"/>
      </g>

      <!-- TULIP (floats + theme-coloured) -->
      <!-- petal-anim-blue class is default; JS swaps to petal-anim-purple -->
      <g id="tulip-float" class="petal-anim-blue">
        <line x1="130" y1="295" x2="130" y2="180"
              stroke="#4a9838" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="130" y1="295" x2="130" y2="340"
              stroke="#4a9838" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        <path d="M128 250 Q105 238 98 218 Q112 224 128 250Z" fill="#5aaa42" opacity="0.9"/>
        <path d="M128 250 Q106 240 100 222"
              stroke="#4a9230" stroke-width="1" fill="none" opacity="0.6"/>
        <path d="M132 238 Q155 225 162 205 Q148 212 132 238Z" fill="#62b448" opacity="0.9"/>
        <path d="M132 238 Q154 227 160 208"
              stroke="#52a038" stroke-width="1" fill="none" opacity="0.6"/>

        <!-- Outer glow halo — ellipse fill updated by JS -->
        <g filter="url(#glowFilter)" opacity="0.5">
          <ellipse id="glowHalo" cx="130" cy="135" rx="44" ry="55" fill="#88ccf0"/>
        </g>

        <!-- Back petals -->
        <ellipse class="glow-petal-slow" cx="104" cy="128" rx="18" ry="34"
                 fill="url(#petalSide)" transform="rotate(-28 104 128)"
                 stroke="rgba(140,200,240,0.4)" stroke-width="1"/>
        <ellipse class="glow-petal-slow" cx="156" cy="128" rx="18" ry="34"
                 fill="url(#petalSide)" transform="rotate(28 156 128)"
                 stroke="rgba(140,200,240,0.4)" stroke-width="1"/>

        <!-- Mid petals -->
        <ellipse class="glow-petal" cx="110" cy="120" rx="20" ry="38"
                 fill="url(#petalOuter)" transform="rotate(-14 110 120)"
                 stroke="rgba(160,215,245,0.45)" stroke-width="1.2"/>
        <ellipse class="glow-petal" cx="150" cy="120" rx="20" ry="38"
                 fill="url(#petalOuter)" transform="rotate(14 150 120)"
                 stroke="rgba(160,215,245,0.45)" stroke-width="1.2"/>

        <!-- Front centre petal -->
        <ellipse class="glow-petal" cx="130" cy="112" rx="22" ry="42"
                 fill="url(#petalCore)"
                 stroke="rgba(180,230,255,0.5)" stroke-width="1.2"/>

        <!-- Highlights -->
        <ellipse cx="122" cy="100" rx="5" ry="12"
                 fill="rgba(255,255,255,0.28)" transform="rotate(-8 122 100)"/>
        <ellipse cx="138" cy="98"  rx="4" ry="10"
                 fill="rgba(255,255,255,0.20)" transform="rotate(6 138 98)"/>

        <!-- Inner soft glow -->
        <g filter="url(#softGlow)" opacity="0.6">
          <ellipse id="innerGlow" cx="130" cy="115" rx="16" ry="26" fill="#c8eeff"/>
        </g>

        <!-- Stamen -->
        <line x1="126" y1="142" x2="124" y2="128"
              stroke="#a0d8f0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <line x1="130" y1="144" x2="130" y2="126"
              stroke="#b0e0f8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <line x1="134" y1="142" x2="136" y2="128"
              stroke="#a0d8f0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <circle cx="124" cy="127" r="2" fill="#d0eeff" opacity="0.8"/>
        <circle cx="130" cy="125" r="2.2" fill="#e0f4ff" opacity="0.9"/>
        <circle cx="136" cy="127" r="2" fill="#d0eeff" opacity="0.8"/>
      </g>
    </svg>
  </div>

  <p class="bq-text" id="bq-text">Flowers for you, Eley. 🌷</p>
  <button id="btn-next" onclick="goNext()">Continue →</button>
</div>

<!-- ══ SWITCH BUTTON (fixed, shown only on bouquet page) ══ -->
<button id="switch-btn" onclick="switchTheme()">
  <span id="switch-dot"></span>
  <span id="switch-label">Switch 🌙</span>
</button>


<!-- ══ JAVASCRIPT ══ -->
<script>

/* ════════════════════════════════════════
   STARS (loading page)
════════════════════════════════════════ */
const starsEl = document.getElementById('load-stars');
for (let i = 0; i < 100; i++) {
  const s = document.createElement('div'); s.className = 'lstar';
  const sz = Math.random()*2.4+0.7;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+1.4).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

/* ════════════════════════════════════════
   LOADING PETALS
════════════════════════════════════════ */
const lCanvas = document.getElementById('petal-canvas-load');
const lCtx    = lCanvas.getContext('2d');
let   lPetals = [], lRaf;

function resizeLC() { lCanvas.width = window.innerWidth; lCanvas.height = window.innerHeight; }
resizeLC();
window.addEventListener('resize', () => { resizeLC(); resizeBC(); });

const LOAD_COLS = [[160,100,220],[100,180,240],[130,140,230],[185,118,242],[118,202,252]];

function spawnLP() {
  const cA = LOAD_COLS[Math.floor(Math.random()*LOAD_COLS.length)];
  const cB = LOAD_COLS[Math.floor(Math.random()*LOAD_COLS.length)];
  lPetals.push({
    x:Math.random()*lCanvas.width, y:-28,
    vx:(Math.random()-.5)*1.3, vy:Math.random()*1.7+0.9,
    rot:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.055,
    w:Math.random()*18+9, h:Math.random()*10+5,
    alpha:Math.random()*.5+.5, cA, cB,
    mixed:Math.random()>.45,
    sway:Math.random()*.022+.009, phase:Math.random()*Math.PI*2, age:0,
  });
}
function drawLP(p) {
  lCtx.save(); lCtx.translate(p.x,p.y); lCtx.rotate(p.rot);
  lCtx.globalAlpha = p.alpha * Math.min(1,(lCanvas.height-p.y)/70);
  if (p.mixed) {
    const g = lCtx.createLinearGradient(-p.w/2,0,p.w/2,0);
    g.addColorStop(0,`rgb(${p.cA})`); g.addColorStop(1,`rgb(${p.cB})`);
    lCtx.fillStyle = g;
  } else { lCtx.fillStyle = `rgb(${p.cA})`; }
  lCtx.beginPath(); lCtx.ellipse(0,0,p.w/2,p.h/2,0,0,Math.PI*2); lCtx.fill();
  lCtx.strokeStyle = 'rgba(255,255,255,.28)'; lCtx.lineWidth = .8;
  lCtx.beginPath(); lCtx.moveTo(-p.w/2+2,0); lCtx.quadraticCurveTo(0,-p.h/2+1,p.w/2-2,0); lCtx.stroke();
  lCtx.restore();
}
let lastLS = 0;
function animLP(ts) {
  lRaf = requestAnimationFrame(animLP);
  lCtx.clearRect(0,0,lCanvas.width,lCanvas.height);
  if (ts-lastLS > 55) { spawnLP(); lastLS = ts; }
  lPetals = lPetals.filter(p => p.y < lCanvas.height+36);
  lPetals.forEach(p => { p.age++; p.x += p.vx+Math.sin(p.age*p.sway+p.phase)*.75; p.y += p.vy; p.rot += p.vr; drawLP(p); });
}
requestAnimationFrame(animLP);

/* ════════════════════════════════════════
   LOADING BAR
════════════════════════════════════════ */
const barEl = document.getElementById('load-bar');
let prog = 0;
const loadInt = setInterval(() => {
  prog = Math.min(100, prog + (prog < 72 ? Math.random()*3+1 : Math.random()*1.4+.3));
  barEl.style.width = prog + '%';
  if (prog >= 100) { clearInterval(loadInt); setTimeout(finishLoad, 550); }
}, 80);

function finishLoad() {
  cancelAnimationFrame(lRaf);
  document.getElementById('pg-load').classList.replace('in','out');
  setTimeout(() => {
    document.getElementById('pg-load').style.display = 'none';
    document.getElementById('pg-stitch').classList.replace('out','in');
  }, 900);
}

/* ════════════════════════════════════════
   NO BUTTON
════════════════════════════════════════ */
let noClicks = 0, noScale = 1.0;
const btnNo = document.getElementById('btn-no');

function clickNo() {
  noClicks++;
  if (noClicks > 5) {
    noScale = Math.max(0.28, noScale-.09);
    btnNo.style.fontSize = noScale + 'rem';
    btnNo.style.padding  = `${.6*noScale}rem ${1.4*noScale}rem`;
    btnNo.style.opacity  = Math.max(0.3, noScale).toString();
  }
  if (noClicks === 1) {
    const r = btnNo.getBoundingClientRect();
    btnNo.style.position = 'fixed';
    btnNo.style.left     = r.left + 'px';
    btnNo.style.top      = r.top  + 'px';
    btnNo.style.margin   = '0';
  }
  const m = 60;
  btnNo.style.left = (m + Math.random()*(window.innerWidth  - m*2)) + 'px';
  btnNo.style.top  = (m + Math.random()*(window.innerHeight - m*2)) + 'px';
}

/* ════════════════════════════════════════
   YES BUTTON
════════════════════════════════════════ */
function clickYes() {
  document.getElementById('pg-stitch').classList.replace('in','out');
  setTimeout(() => {
    document.getElementById('pg-stitch').style.display = 'none';
    document.getElementById('pg-bouquet').classList.replace('out','in');
    startBlossoms();
    setTimeout(showTulip, 400);
    // Show switch button after tulip is revealed
    setTimeout(() => {
      document.getElementById('switch-btn').style.display = 'flex';
    }, 2900);
  }, 900);
}

/* ════════════════════════════════════════
   CHERRY BLOSSOMS — bouquet page canvas
   Colour-aware: lerps between blue and purple palettes
════════════════════════════════════════ */
const bCanvas  = document.getElementById('blossom-canvas');
const bCtx     = bCanvas.getContext('2d');
let   blossoms = [], bRaf, bRunning = false;
let   blossomTheme = 'blue'; // 'blue' | 'purple'

function resizeBC() { bCanvas.width = window.innerWidth; bCanvas.height = window.innerHeight; }
resizeBC();

/* Palette pools */
const BLOSSOM_BLUE = [
  {r:255,g:182,b:193},{r:255,g:192,b:203},{r:255,g:160,b:180},
  {r:255,g:218,b:224},{r:240,g:160,b:185},{r:255,g:200,b:215},
  {r:130,g:195,b:240},{r:150,g:210,b:250},{r:110,g:180,b:235},
  {r:155,g:155,b:235},{r:140,g:170,b:230},
];
const BLOSSOM_PURPLE = [
  {r:180,g:100,b:240},{r:200,g:120,b:255},{r:160,g: 80,b:220},
  {r:210,g:130,b:255},{r:140,g: 60,b:210},{r:190,g:110,b:245},
  {r:220,g:140,b:255},{r:170,g: 90,b:235},{r:150,g: 70,b:220},
  {r:200,g:150,b:255},{r:230,g:160,b:255},
];

/* Colour lerp speed for existing blossoms on theme switch */
const LERP = 0.020;

function spawnBlossom() {
  const pool = blossomTheme === 'blue' ? BLOSSOM_BLUE : BLOSSOM_PURPLE;
  const base = pool[Math.floor(Math.random()*pool.length)];
  const type = Math.random() > .38 ? 'flower' : 'petal';
  const glow = Math.random() < 0.28; // ~28% get glow
  blossoms.push({
    x:Math.random()*bCanvas.width, y:-22,
    vx:(Math.random()-.5)*.8, vy:Math.random()*.8+0.35,
    rot:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.028,
    size:type==='flower' ? Math.random()*10+8 : Math.random()*13+6,
    // current colour (lerps)
    cr:base.r, cg:base.g, cb:base.b,
    // target colour
    tr:base.r, tg:base.g, tb:base.b,
    alpha: type==='flower' ? .72 : .65,
    type, glow,
    sway:Math.random()*.012+.005, phase:Math.random()*Math.PI*2, age:0,
  });
}

/* Retarget existing blossoms when theme switches */
function retargetBlossoms() {
  const pool = blossomTheme === 'blue' ? BLOSSOM_BLUE : BLOSSOM_PURPLE;
  blossoms.forEach(p => {
    const base = pool[Math.floor(Math.random()*pool.length)];
    p.tr = base.r; p.tg = base.g; p.tb = base.b;
  });
}

function drawBlossom(p) {
  /* lerp colour */
  p.cr += (p.tr - p.cr) * LERP;
  p.cg += (p.tg - p.cg) * LERP;
  p.cb += (p.tb - p.cb) * LERP;

  const rc = Math.round(p.cr), gc = Math.round(p.cg), bc = Math.round(p.cb);
  const fade = p.alpha * Math.min(1,(bCanvas.height-p.y)/70);

  bCtx.save(); bCtx.translate(p.x,p.y); bCtx.rotate(p.rot);
  bCtx.globalAlpha = fade;

  /* glow for selected petals */
  if (p.glow) {
    bCtx.shadowBlur  = 16;
    bCtx.shadowColor = `rgba(${rc},${gc},${bc},0.9)`;
  }

  if (p.type === 'flower') {
    for (let i = 0; i < 5; i++) {
      bCtx.save(); bCtx.rotate((i/5)*Math.PI*2);
      bCtx.fillStyle = `rgb(${rc},${gc},${bc})`;
      bCtx.beginPath(); bCtx.ellipse(0,-p.size*.55,p.size*.3,p.size*.5,0,0,Math.PI*2); bCtx.fill();
      bCtx.restore();
    }
    bCtx.shadowBlur = 0;
    bCtx.fillStyle  = `rgba(255,220,150,0.85)`;
    bCtx.beginPath(); bCtx.arc(0,0,p.size*.17,0,Math.PI*2); bCtx.fill();
  } else {
    bCtx.fillStyle = `rgb(${rc},${gc},${bc})`;
    bCtx.beginPath(); bCtx.ellipse(0,0,p.size*.36,p.size*.54,0,0,Math.PI*2); bCtx.fill();
    bCtx.shadowBlur = 0;
    bCtx.strokeStyle = 'rgba(255,255,255,.3)'; bCtx.lineWidth = .65;
    bCtx.beginPath(); bCtx.moveTo(0,-p.size*.48); bCtx.lineTo(0,p.size*.48); bCtx.stroke();
  }
  bCtx.restore();
}

let lastBS = 0;
function animBlossoms(ts) {
  bRaf = requestAnimationFrame(animBlossoms);
  bCtx.clearRect(0,0,bCanvas.width,bCanvas.height);
  if (ts-lastBS > 90) { spawnBlossom(); lastBS = ts; }
  blossoms = blossoms.filter(p => p.y < bCanvas.height+30);
  blossoms.forEach(p => {
    p.age++;
    p.x += p.vx + Math.sin(p.age*p.sway+p.phase)*.55;
    p.y += p.vy;
    p.rot += p.vr;
    drawBlossom(p);
  });
}

function startBlossoms() {
  if (bRunning) return; bRunning = true;
  requestAnimationFrame(animBlossoms);
}

/* ════════════════════════════════════════
   TULIP REVEAL
════════════════════════════════════════ */
function showTulip() {
  setTimeout(() => { document.getElementById('tulip-scene').classList.add('show'); }, 200);
  setTimeout(() => { document.getElementById('tulip-float').classList.add('floating'); }, 1300);
  setTimeout(() => { document.getElementById('bq-text').classList.add('show'); }, 1800);
  setTimeout(() => { document.getElementById('btn-next').classList.add('show'); }, 2800);
}

/* ════════════════════════════════════════
   THEME SWITCH
   Sky-blue ↔ Purple
   Syncs: background, petal glow anims, SVG gradient stops, blossom colours
════════════════════════════════════════ */
let isPurple = false;

/* Colour tables for SVG gradient stops */
const TULIP_BLUE = {
  core:  ['#d0f0ff','#90ccf0','#60a8d8'],
  outer: ['#b8e4f8','#78b8e0','#5898c8'],
  side:  ['#a8d8f0','#68a8d0','#4888b8'],
  halo:  '#88ccf0',
  inner: '#c8eeff',
};
const TULIP_PURPLE = {
  core:  ['#f0d8ff','#c070f0','#9040d0'],
  outer: ['#e8c8ff','#b060e0','#8030c0'],
  side:  ['#d8b8f8','#a050d0','#7020b0'],
  halo:  '#c060f0',
  inner: '#e0b8ff',
};

function applyTulipColors(palette) {
  // core stops
  document.getElementById('pCore0').setAttribute('stop-color', palette.core[0]);
  document.getElementById('pCore1').setAttribute('stop-color', palette.core[1]);
  document.getElementById('pCore2').setAttribute('stop-color', palette.core[2]);
  // outer stops
  document.getElementById('pOut0').setAttribute('stop-color', palette.outer[0]);
  document.getElementById('pOut1').setAttribute('stop-color', palette.outer[1]);
  document.getElementById('pOut2').setAttribute('stop-color', palette.outer[2]);
  // side stops
  document.getElementById('pSide0').setAttribute('stop-color', palette.side[0]);
  document.getElementById('pSide1').setAttribute('stop-color', palette.side[1]);
  document.getElementById('pSide2').setAttribute('stop-color', palette.side[2]);
  // halo + inner glow ellipses
  document.getElementById('glowHalo').setAttribute('fill', palette.halo);
  document.getElementById('innerGlow').setAttribute('fill', palette.inner);
}

function switchTheme() {
  isPurple = !isPurple;

  const themeBg   = document.getElementById('theme-bg');
  const switchBtn = document.getElementById('switch-btn');
  const dot       = document.getElementById('switch-dot');
  const label     = document.getElementById('switch-label');
  const bqText    = document.getElementById('bq-text');
  const tulipFloat = document.getElementById('tulip-float');

  if (isPurple) {
    /* ── → PURPLE ── */
    themeBg.classList.add('purple');
    switchBtn.classList.add('purple-mode');
    dot.classList.add('purple');
    label.textContent = 'Switch ☀️';
    bqText.classList.add('purple');
    blossomTheme = 'purple';
    retargetBlossoms();
    applyTulipColors(TULIP_PURPLE);
    tulipFloat.classList.remove('petal-anim-blue');
    tulipFloat.classList.add('petal-anim-purple');
  } else {
    /* ── → SKY BLUE ── */
    themeBg.classList.remove('purple');
    switchBtn.classList.remove('purple-mode');
    dot.classList.remove('purple');
    label.textContent = 'Switch 🌙';
    bqText.classList.remove('purple');
    blossomTheme = 'blue';
    retargetBlossoms();
    applyTulipColors(TULIP_BLUE);
    tulipFloat.classList.remove('petal-anim-purple');
    tulipFloat.classList.add('petal-anim-blue');
  }
}

function goNext() { alert('Next page coming soon! 🌷'); }
</script>
